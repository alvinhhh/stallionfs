name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: ${{ matrix.os == 'macos-26-intel' && 30 || 15 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', images: '0'}
          - {os: macos-26, python: '3.11', images: '1'}
          - {os: macos-26, python: '3.13', images: '1'}
          - {os: macos-26, python: '3.14', images: '1'}
          - {os: macos-26-intel, python: '3.13', images: '1'}
          - {os: xcode-27, python: '3.13', images: '1'}
    env:
      STALLIONFS_TEST_IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m compileall -q stallionfs
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel with image failure diagnostics
        env:
          STALLIONFS_FSKIT_ARTIFACT_DIR: ${{ runner.temp }}/fskit-interface-diagnostics
          STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT: ${{ matrix.os == 'xcode-27' && '1' || '0' }}
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import faulthandler
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import unittest
          import stallionfs
          from stallionfs import images, _scan

          require_contextual = os.environ.get('STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT') == '1'
          contextual_test = 'test_fskit.FSKitInterfaces.test_contextual_and_legacy_callbacks_and_production_builds'

          def require_contextual_environment():
              host = (sys.platform, platform.mac_ver()[0], platform.machine())
              print('Contextual FSKit host:', host, flush=True)
              def version(label, argv):
                  child = subprocess.run(argv, capture_output=True, text=True, timeout=15)
                  print(f'{label}: {child.stdout.strip()!r}; stderr: {child.stderr.strip()!r}', flush=True)
                  child.check_returncode()
                  return child.stdout.strip()
              build = version('macOS build', ['/usr/bin/sw_vers', '-buildVersion'])
              xcode = version('Selected Xcode', ['/usr/bin/xcodebuild', '-version'])
              sdk = version('Selected macOS SDK', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version'])
              if (host[0] != 'darwin' or not re.fullmatch(r'\d+(?:\.\d+)*', host[1])
                      or int(host[1].split('.')[0]) < 27 or host[2] != 'arm64'
                      or not re.fullmatch(r'\d+[A-Z]\d+[a-z]?', build)
                      or not re.fullmatch(r'Xcode 27\.1\nBuild version [A-Za-z0-9]+', xcode)
                      or sdk != '27.0'):
                  raise RuntimeError('Contextual FSKit requires macOS 27+ ARM64 with selected Xcode 27.1 and SDK 27.0')

          class ContextualResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.contextual_successes = 0
              def addSuccess(self, test):
                  super().addSuccess(test)
                  if test.id() == contextual_test:
                      self.contextual_successes += 1

          if require_contextual:
              require_contextual_environment()

          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(stallionfs.__file__).resolve().is_relative_to(checkout)
          assert not Path(_scan.__file__).resolve().is_relative_to(checkout)
          sys.path.insert(0, str(checkout / 'tests'))
          from image_failure_diagnostics import install
          diagnostics = install(images, Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          faulthandler.dump_traceback_later(300)
          suite = unittest.defaultTestLoader.discover(str(checkout / 'tests'))
          try:
              result = unittest.TextTestRunner(verbosity=2, resultclass=ContextualResult).run(suite)
          finally:
              try:
                  diagnostics.close()
              except Exception as error:
                  print('Diagnostic close failed:', type(error).__name__, file=sys.stderr)
          faulthandler.cancel_dump_traceback_later()
          capability_skips = [
              (test, reason) for test, reason in result.skipped
              if test.id() == 'setUpClass (test_fskit.FSKitInterfaces)'
              and reason.startswith('FSKit capability unavailable: ')
          ]
          for _, reason in capability_skips:
              print(reason, file=sys.stderr)
          required_skips = os.environ.get('STALLIONFS_TEST_IMAGES') == '1' and [
              entry for entry in result.skipped if entry not in capability_skips
          ]
          if required_skips:
              print('Required filesystem tests were skipped.', file=sys.stderr)
          missing_contextual = require_contextual and result.contextual_successes != 1
          if missing_contextual:
              print(f'Required {contextual_test} successes: expected 1, observed {result.contextual_successes}', file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(required_skips) or missing_contextual)
          PY
      - name: Validate bounded image diagnostic artifact
        if: failure()
        id: image-diagnostics
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          from image_failure_diagnostics import artifact_available
          available = artifact_available(Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(available).lower() + '\n')
          PY
      - name: Upload bounded image failure diagnostics
        if: failure() && steps.image-diagnostics.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-failure-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/image-failure-diagnostics/image-failures.jsonl
          if-no-files-found: error
          retention-days: 1
      - name: Upload FSKit interface failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fskit-interface-failure-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/fskit-interface-diagnostics/*.command.json
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stdout.bin
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stderr.bin
          if-no-files-found: ignore
          retention-days: 1
      - name: Check native code with sanitizers
        if: matrix.python == '3.13'
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          names = (
              'test_fileops.FileOperations.test_native_swaps_enospc_no_fallback_cancellation_and_fd_cleanup',
              'test_scan.Scan.test_native_cancellation_close_errors_and_no_partial_cli_totals',
              'test_image.ImageCore',
          )
          for sanitizers in ('address,undefined', 'thread'):
              print('Sanitizers:', sanitizers, flush=True)
              os.environ['CFLAGS'] = f'-g -fno-omit-frame-pointer -fsanitize={sanitizers} -fno-sanitize-recover=all'
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped:
                  sys.exit(1)
          PY
      - run: |
          cd "$RUNNER_TEMP"
          stallionfs --root "$RUNNER_TEMP/stallionfs-smoke" doctor
