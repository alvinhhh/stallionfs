name: Checks
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted action
        type: choice
        options: [compare, thread-cpu, directory-feasibility, directory-docs-feasibility, delete-thread-cpu, unsigned-app-artifact, native-git-qualification, registered-git-recheck]
        default: compare
      expected-source-sha:
        description: Reviewed full source SHA for native Git qualification
        type: string
        required: false
permissions:
  contents: read
jobs:
  test-execution:
    name: ${{ matrix.phase }} (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.images }})
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: ${{ (matrix.os == 'macos-26-intel' || matrix.os == 'xcode-27') && 30 || (matrix.os == 'macos-26' && matrix.python == '3.13') && 20 || 15 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', images: '0', phase: installed}
          - {os: macos-26, python: '3.11', images: '1', phase: installed}
          - {os: macos-26, python: '3.13', images: '1', phase: installed}
          - {os: macos-26, python: '3.14', images: '1', phase: installed}
          - {os: macos-26-intel, python: '3.13', images: '1', phase: installed}
          - {os: xcode-27, python: '3.13', images: '1', phase: installed}
          - {os: macos-26, python: '3.13', images: '1', phase: sanitizer}
          - {os: macos-26-intel, python: '3.13', images: '1', phase: sanitizer}
          - {os: xcode-27, python: '3.13', images: '1', phase: sanitizer}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STALLIONFS_TEST_IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Create owned CI interpreter
        id: ci-python
        timeout-minutes: 2
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import os
          BOOTSTRAP_SOURCE = r"""import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import platform
          import stat
          import subprocess
          import sys
          import sysconfig
          import venv

          def require(value, message):
              if not value: raise ValueError(message)

          def identity(path, directory=False):
              path = Path(path)
              require(path.is_absolute() and path.resolve(strict=True) == path, 'Physical CI path required')
              info = path.lstat()
              require(info.st_uid == os.getuid() and not info.st_mode & 0o022, 'CI path ownership or mode differs')
              require(stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode) and info.st_nlink == 1,
                      'CI path type differs')
              value = [info.st_dev, info.st_ino, info.st_uid, stat.S_IFMT(info.st_mode), stat.S_IMODE(info.st_mode)]
              return value if directory else value + [info.st_size, info.st_mtime_ns, info.st_ctime_ns]

          def read(path, limit):
              before = identity(path)
              require(before[5] <= limit, 'CI input exceeds bound')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream: data = stream.read(limit + 1)
              require(len(data) <= limit and identity(path) == before, 'CI input changed')
              return data

          def write_new(path, data):
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream: stream.write(data)

          def facts():
              executable = Path(getattr(sys, '_base_executable', sys.executable)).resolve(strict=True)
              return {'version': sys.version, 'architecture': platform.machine(),
                      'base_prefix': str(Path(sys.base_prefix).resolve(strict=True)),
                      'base_executable_sha256': hashlib.sha256(executable.read_bytes()).hexdigest()}

          def validate(value, container, environment, base):
              require(value['schema'] == 1 and value['base'] == base, 'CI interpreter origin differs')
              require(value['container_identity'] == identity(container, True)
                      and value['environment_identity'] == identity(environment, True), 'CI environment replaced')
              selected = Path(value['executable'])
              require(selected.is_relative_to(environment) and selected.parent == Path(value['paths']['scripts']), 'CI executable escaped')
              require(value['executable_identity'] == identity(selected) and os.access(selected, os.X_OK)
                      and hashlib.sha256(read(selected, 64 * 1024**2)).hexdigest() == base['base_executable_sha256'], 'CI interpreter copy differs')
              require(value['prefix'] == str(environment) and value['base_prefix'] == base['base_prefix']
                      and value['prefix'] != value['base_prefix'] and value['version'] == base['version']
                      and value['architecture'] == base['architecture'] and value['uid'] == os.getuid(), 'CI interpreter context differs')
              require(set(value['paths']) == {'scripts', 'purelib', 'platlib', 'data'}, 'CI installation scheme differs')
              for name, destination in value['paths'].items():
                  path = Path(destination)
                  require(path.is_relative_to(environment) and path.resolve(strict=True) == path, 'CI installation path escaped')
                  identity(path, True)
              require(value['scripts_identity'] == identity(selected.parent, True), 'CI scripts directory replaced')
              return selected

          def probe(container, environment, receipt, base, environment_identity):
              require(identity(environment, True) == environment_identity, 'CI environment replaced during creation')
              selected = Path(sys.executable).absolute()
              paths = {name: str(Path(sysconfig.get_path(name)).absolute()) for name in ('scripts', 'purelib', 'platlib', 'data')}
              value = {'schema': 1, 'base': base, 'container_identity': identity(container, True),
                       'environment_identity': identity(environment, True), 'executable': str(selected),
                       'executable_identity': identity(selected), 'prefix': str(Path(sys.prefix).resolve(strict=True)),
                       'base_prefix': str(Path(sys.base_prefix).resolve(strict=True)), 'version': sys.version,
                       'architecture': platform.machine(), 'uid': os.getuid(), 'paths': paths,
                       'scripts_identity': identity(Path(paths['scripts']), True)}
              validate(value, container, environment, base)
              write_new(receipt, (json.dumps(value, sort_keys=True) + '\n').encode())

          def create(driver, container, environment, receipt, base, environment_identity):
              require(identity(environment, True) == environment_identity and not list(environment.iterdir()), 'CI environment is not fresh')
              class Builder(venv.EnvBuilder):
                  def post_setup(self, context): self.selected = context.env_exe
              builder = Builder(with_pip=True, symlinks=False, upgrade=False, upgrade_deps=False)
              builder.create(str(environment))
              require(identity(environment, True) == environment_identity, 'CI environment replaced during creation')
              selected = Path(builder.selected).absolute()
              identity(selected)
              subprocess.run([str(selected), '-I', '-B', str(driver), 'probe', str(container), str(environment),
                              str(receipt), json.dumps(base), json.dumps(environment_identity)], check=True)

          def bootstrap(temporary, checkout, github_env, github_path):
              temporary = temporary.resolve(strict=True)
              container = temporary / 'ci-python'
              reserved = False
              try:
                  container.mkdir(mode=0o700); reserved = True
                  container_identity = identity(container, True)
                  environment = container / 'venv'; environment.mkdir(mode=0o700)
                  environment_identity = identity(environment, True)
                  driver = container / 'bootstrap.py'; receipt = container / 'origin.json'
                  write_new(driver, BOOTSTRAP_SOURCE.encode())
                  driver_identity = identity(driver); base = facts()
                  spec = importlib.util.spec_from_file_location('ci_bootstrap_capture', checkout / 'tools/ci_execute.py')
                  runner = importlib.util.module_from_spec(spec); spec.loader.exec_module(runner)
                  previous = sys.argv
                  try:
                      sys.argv = ['ci_execute.py', '--timeout', '90', '--stem', str(container / 'create'), str(driver),
                                  'create', str(driver), str(container), str(environment), str(receipt), json.dumps(base), json.dumps(environment_identity)]
                      runner.main()
                  finally: sys.argv = previous
                  require(identity(container, True) == container_identity and identity(driver) == driver_identity
                          and read(driver, 65536).decode() == BOOTSTRAP_SOURCE, 'CI bootstrap paths replaced')
                  value = json.loads(read(receipt, 16384))
                  selected = validate(value, container, environment, base)
                  scripts = Path(value['paths']['scripts'])
                  require(all(character.isprintable() for path in (selected, scripts, container) for character in str(path)),
                          'Invalid CI interpreter path')
                  with github_env.open('a') as output, github_path.open('a') as path_output:
                      output.write('CI_PYTHON=' + str(selected) + '\nCI_CONTAINER=' + str(container) + '\n')
                      path_output.write(str(scripts) + '\n')
              except BaseException as error:
                  print('Owned CI interpreter setup failed:', type(error).__name__, flush=True)
                  if reserved:
                      for name in ('create.command.json', 'create.stderr.bin', 'create.stdout.bin', 'origin.json'):
                          try: data = read(container / name, 1024 * 1024)
                          except (OSError, ValueError): continue
                          print(name + ':', data[:8192].decode('utf-8', errors='replace'), flush=True)
                  if isinstance(error, SystemExit) and error.code in (0, None):
                      raise RuntimeError('CI bootstrap exited before completion') from error
                  raise

          def check_install(container, seal):
              value = json.loads(read(container / 'origin.json', 16384))
              selected = validate(value, container, container / 'venv', value['base'])
              require(Path(sys.executable).absolute() == selected, 'Wrong installed CI interpreter')
              scripts = Path(value['paths']['scripts'])
              helper = scripts / 'stallionfs-python'; data = read(helper, 65536)
              direct = ('#!' + str(selected) + '\n').encode()
              quoted = '"' + str(selected) + '"' if ' ' in str(selected) else str(selected)
              shell = ("#!/bin/sh\n'''exec' " + quoted + " \"$0\" \"$@\"\n' '''\n").encode()
              require(os.access(helper, os.X_OK) and (data.startswith(direct) or data.startswith(shell))
                      and b'from stallionfs.__main__ import main' in data, 'Installed console helper route differs')
              bound = {}
              for name in ('stallionfs-python', 'sfs', 'stallionfs'):
                  path = scripts / name
                  require(os.access(path, os.X_OK), 'Installed CI launcher is not executable')
                  bound[name] = {'identity': identity(path), 'sha256': hashlib.sha256(read(path, 64 * 1024**2)).hexdigest()}
              if seal: write_new(container / 'launchers.json', (json.dumps(bound, sort_keys=True) + '\n').encode())
              else: require(json.loads(read(container / 'launchers.json', 16384)) == bound, 'Installed CI launcher changed')

          if __name__ == '__main__':
              mode, *arguments = sys.argv[1:]
              if mode == 'create': create(*map(Path, arguments[:4]), json.loads(arguments[4]), json.loads(arguments[5]))
              elif mode == 'probe': probe(*map(Path, arguments[:3]), json.loads(arguments[3]), json.loads(arguments[4]))
              elif mode in ('seal', 'check'): check_install(Path(arguments[0]), mode == 'seal')
              else: raise ValueError('Unknown CI environment operation')
          """
          scope = {'__name__': 'ci_inline', 'BOOTSTRAP_SOURCE': BOOTSTRAP_SOURCE}
          exec(compile(BOOTSTRAP_SOURCE, '<owned-ci-interpreter>', 'exec'), scope)
          scope['bootstrap'](Path(os.environ['RUNNER_TEMP']), Path(os.environ['GITHUB_WORKSPACE']).resolve(),
                             Path(os.environ['GITHUB_ENV']), Path(os.environ['GITHUB_PATH']))
          PY
      - name: Install pinned wheel backend
        run: |
          "${CI_PYTHON:?}" -I -B -m pip --isolated install --no-deps --no-compile --only-binary=:all: --require-hashes -r tools/ci-build-requirements.txt
      - name: Fetch exact qualified architecture component
        id: component-fetch
        run: |
          "${CI_PYTHON:?}" -I -B tools/ci_execute.py --timeout 600 --stem "$RUNNER_TEMP/component-fetch" tools/ci_build.py fetch --checkout "$GITHUB_WORKSPACE" --component "$RUNNER_TEMP/qualified-git-component"
      - name: Upload component fetch failure diagnostics
        if: failure() && steps.component-fetch.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-fetch-${{ matrix.os }}-${{ matrix.python }}${{ matrix.phase == 'sanitizer' && '-sanitizer' || '' }}
          path: |
            ${{ runner.temp }}/component-fetch.command.json
            ${{ runner.temp }}/component-fetch.stdout.bin
            ${{ runner.temp }}/component-fetch.stderr.bin
          if-no-files-found: ignore
          retention-days: 1
      - name: Build current wheel with enforced Git cache reuse
        run: |
          "${CI_PYTHON:?}" -I -B tools/ci_execute.py --timeout 600 --stem "$RUNNER_TEMP/cache-wheel-build" tools/ci_build.py build --checkout "$GITHUB_WORKSPACE" --component "$RUNNER_TEMP/qualified-git-component" --output "$RUNNER_TEMP/qualified-wheel"
      - name: Install current owned wheel
        run: |
          "${CI_PYTHON:?}" -I -B -m pip --isolated install --no-index --force-reinstall --no-deps --no-compile "$RUNNER_TEMP"/qualified-wheel/*.whl
          "${CI_PYTHON:?}" -I -B "${CI_CONTAINER:?}/bootstrap.py" seal "${CI_CONTAINER:?}"
      - name: Test installed wheel with image failure diagnostics
        if: matrix.phase == 'installed'
        env:
          STALLIONFS_FSKIT_ARTIFACT_DIR: ${{ runner.temp }}/fskit-interface-diagnostics
          STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT: ${{ matrix.os == 'xcode-27' && '1' || '0' }}
          STALLIONFS_TEST_SNAPSHOT_OBSERVATION: ${{ matrix.os == 'macos-26' && matrix.python == '3.11' && 'restored-cleanup' || matrix.os == 'macos-26' && matrix.python == '3.14' && 'enospc-initial-detach' || matrix.os == 'macos-26-intel' && 'closed-snapshot' || 'initial-unmount' }}
        run: |
          cd "$RUNNER_TEMP"
          "${CI_PYTHON:?}" -I -B - <<'PY'
          import faulthandler
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import unittest
          import stallionfs
          from stallionfs import images, _scan

          require_contextual = os.environ.get('STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT') == '1'
          contextual_test = 'test_fskit.FSKitInterfaces.test_contextual_and_legacy_callbacks_and_production_builds'

          def require_contextual_environment():
              host = (sys.platform, platform.mac_ver()[0], platform.machine())
              print('Contextual FSKit host:', host, flush=True)
              def version(label, argv):
                  child = subprocess.run(argv, capture_output=True, text=True, timeout=15)
                  print(f'{label}: {child.stdout.strip()!r}; stderr: {child.stderr.strip()!r}', flush=True)
                  child.check_returncode()
                  return child.stdout.strip()
              build = version('macOS build', ['/usr/bin/sw_vers', '-buildVersion'])
              xcode = version('Selected Xcode', ['/usr/bin/xcodebuild', '-version'])
              sdk = version('Selected macOS SDK', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version'])
              if (host[0] != 'darwin' or not re.fullmatch(r'\d+(?:\.\d+)*', host[1])
                      or int(host[1].split('.')[0]) < 27 or host[2] != 'arm64'
                      or not re.fullmatch(r'\d+[A-Z]\d+[a-z]?', build)
                      or not re.fullmatch(r'Xcode 27\.1\nBuild version [A-Za-z0-9]+', xcode)
                      or sdk != '27.0'):
                  raise RuntimeError('Contextual FSKit requires macOS 27+ ARM64 with selected Xcode 27.1 and SDK 27.0')

          class ContextualResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.contextual_successes = 0
              def addSuccess(self, test):
                  super().addSuccess(test)
                  if test.id() == contextual_test:
                      self.contextual_successes += 1

          if require_contextual:
              require_contextual_environment()

          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(stallionfs.__file__).resolve().is_relative_to(checkout)
          assert not Path(_scan.__file__).resolve().is_relative_to(checkout)
          import importlib.util
          spec = importlib.util.spec_from_file_location('ci_build', checkout / 'tools/ci_build.py')
          controller = importlib.util.module_from_spec(spec); spec.loader.exec_module(controller)
          admitted = controller.initialize_installed(checkout, Path(os.environ['RUNNER_TEMP']).resolve() / 'qualified-wheel')
          admitted['check']()
          import sysconfig
          native_cli = Path(sysconfig.get_path('scripts')) / 'stallionfs'
          assert native_cli.is_absolute() and native_cli.is_relative_to(Path(sys.prefix).resolve())
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('CI_STALLIONFS=' + str(native_cli) + '\n')
          sys.path.insert(0, str(checkout / 'tests'))
          from image_failure_diagnostics import install
          diagnostics = install(images, Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          faulthandler.dump_traceback_later(300, repeat=True)
          suite = unittest.defaultTestLoader.discover(str(checkout / 'tests'))
          try:
              result = unittest.TextTestRunner(verbosity=2, resultclass=ContextualResult).run(suite)
          finally:
              try:
                  diagnostics.close()
              except Exception as error:
                  print('Diagnostic close failed:', type(error).__name__, file=sys.stderr)
          faulthandler.cancel_dump_traceback_later()
          admitted['check']()
          capability_skips = [
              (test, reason) for test, reason in result.skipped
              if test.id() == 'setUpClass (test_fskit.FSKitInterfaces)'
              and reason.startswith('FSKit capability unavailable: ')
          ]
          for _, reason in capability_skips:
              print(reason, file=sys.stderr)
          required_skips = os.environ.get('STALLIONFS_TEST_IMAGES') == '1' and [
              entry for entry in result.skipped if entry not in capability_skips
          ]
          if required_skips:
              print('Required filesystem tests were skipped.', file=sys.stderr)
          missing_contextual = require_contextual and result.contextual_successes != 1
          if missing_contextual:
              print(f'Required {contextual_test} successes: expected 1, observed {result.contextual_successes}', file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(required_skips) or missing_contextual)
          PY
      - name: Check large sparse-seek metadata with default limits
        if: success() && matrix.phase == 'installed' && matrix.os == 'macos-15' && matrix.python == '3.12'
        timeout-minutes: 9
        env:
          STALLION_SEEK_LARGE_METADATA: '1'
          CFLAGS: ''
        run: |
          cd "$RUNNER_TEMP"
          if ! mkdir -m 700 "$RUNNER_TEMP/sparse-seek-large"; then
            echo 'UNQUALIFIED large metadata: fresh evidence directory unavailable'
            exit 2
          fi
          export TMPDIR="$RUNNER_TEMP/sparse-seek-large"
          "${CI_PYTHON:?}" -I -B - <<'PY'
          import os, re, resource, shutil, subprocess, sys, time, unittest
          from pathlib import Path

          try:
              temporary = Path(os.environ['RUNNER_TEMP']).resolve()
              checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              assert Path.cwd().resolve() == temporary and sys.platform == 'darwin'
              assert os.environ.get('STALLION_SEEK_LARGE_METADATA') == '1'
              assert os.environ.get('CFLAGS', '') == ''
              disk = shutil.disk_usage(temporary).free
              vm = subprocess.run(['/usr/bin/vm_stat'], stdin=subprocess.DEVNULL,
                                  capture_output=True, text=True, timeout=5, check=True)
              assert not vm.stderr and len(vm.stdout.encode()) <= 16384
              page = int(re.search(r'page size of (\d+) bytes', vm.stdout)[1])
              fields = {k.strip(): int(v) for k, v in
                        re.findall(r'^([^:\n]+):\s+(\d+)\.', vm.stdout, re.MULTILINE)}
              memory_estimate = page * sum(fields[k] for k in
                                          ('Pages free', 'Pages inactive', 'Pages speculative'))
              print('Large metadata admission:', disk, memory_estimate, flush=True)
              if disk < 2 * 1024**3 or memory_estimate < 3 * 1024**3:
                  print('UNQUALIFIED large metadata: insufficient disk/memory headroom', flush=True)
                  raise SystemExit(2)

              import stallionfs
              from stallionfs import _image, _scan
              for module in (stallionfs, _image, _scan):
                  path = Path(module.__file__).resolve()
                  assert not path.is_relative_to(checkout), path
                  print('Installed-wheel module:', path, flush=True)
              sys.path.insert(0, str(checkout / 'tests'))
              import test_image
              assert Path(test_image.__file__).resolve() == checkout / 'tests/test_image.py'
              selector = 'test_image.ImageCore.test_seek_default_budget_10gib_metadata_shape'
              suite = unittest.defaultTestLoader.loadTestsFromName(selector)
              assert suite.countTestCases() == 1
              assert [test.id() for test in suite] == [selector]
              resource.setrlimit(resource.RLIMIT_CPU, (300, 300))
              resource.setrlimit(resource.RLIMIT_FSIZE, (1024**3, 1024**3))
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          except Exception as error:
              print('UNQUALIFIED large metadata: admission/setup failed:',
                    type(error).__name__, str(error), flush=True)
              raise SystemExit(2)

          class LargeResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.peak_bytes = None

              def addSuccess(self, test):
                  # The body/instance cleanup finished; class teardown has not run yet.
                  try:
                      self.peak_bytes = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
                      if self.peak_bytes > 1536 * 1024**2:
                          raise RuntimeError('Large metadata child peak RSS exceeds 1.5 GiB')
                  except Exception:
                      test_image.ImageCore.retain_requested = True
                      self.stream.writeln('UNQUALIFIED large metadata: resource observation/refusal')
                      self.addFailure(test, sys.exc_info())
                      return
                  super().addSuccess(test)

          started = time.monotonic()
          result = unittest.TextTestRunner(verbosity=2, resultclass=LargeResult).run(suite)
          print('Large metadata resource observation:', time.monotonic() - started,
                result.peak_bytes, flush=True)
          raise SystemExit(not (result.testsRun == 1 and result.wasSuccessful()
                                and not result.skipped))
          PY
      - name: Validate bounded image diagnostic artifact
        if: failure() && matrix.phase == 'installed' && steps.ci-python.outcome == 'success'
        id: image-diagnostics
        run: |
          cd "$RUNNER_TEMP"
          "${CI_PYTHON:?}" -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          from image_failure_diagnostics import artifact_available
          available = artifact_available(Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(available).lower() + '\n')
          PY
      - name: Upload bounded image failure diagnostics
        if: failure() && matrix.phase == 'installed' && steps.image-diagnostics.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-failure-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/image-failure-diagnostics/image-failures.jsonl
          if-no-files-found: error
          retention-days: 1
      - name: Upload FSKit interface failure diagnostics
        if: failure() && matrix.phase == 'installed'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fskit-interface-failure-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/fskit-interface-diagnostics/*.command.json
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stdout.bin
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stderr.bin
            ${{ runner.temp }}/sparse-seek-large/stallionfs-image-tests-*/command-*.command.json
            ${{ runner.temp }}/sparse-seek-large/stallionfs-image-tests-*/command-*.stdout.bin
            ${{ runner.temp }}/sparse-seek-large/stallionfs-image-tests-*/command-*.stderr.bin
          if-no-files-found: ignore
          retention-days: 1
      - name: Check native code with sanitizers
        if: matrix.phase == 'sanitizer'
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cd "$RUNNER_TEMP"
          "${CI_PYTHON:?}" -I -B - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import unittest

          import stallionfs
          from stallionfs import _scan
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(stallionfs.__file__).resolve().is_relative_to(checkout)
          assert not Path(_scan.__file__).resolve().is_relative_to(checkout)
          spec = importlib.util.spec_from_file_location('ci_build', checkout / 'tools/ci_build.py')
          controller = importlib.util.module_from_spec(spec); spec.loader.exec_module(controller)
          admitted = controller.initialize_installed(checkout, Path(os.environ['RUNNER_TEMP']).resolve() / 'qualified-wheel')
          admitted['check']()
          native_cli = Path(sysconfig.get_path('scripts')) / 'stallionfs'
          assert native_cli.is_absolute() and native_cli.is_relative_to(Path(sys.prefix).resolve())
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('CI_STALLIONFS=' + str(native_cli) + '\n')
          sys.path.insert(0, str(checkout / 'tests'))
          names = (
              'test_fileops.FileOperations.test_native_swaps_enospc_no_fallback_cancellation_and_fd_cleanup',
              'test_scan.Scan.test_native_cancellation_close_errors_and_no_partial_cli_totals',
              'test_image.ImageCore',
          )
          try:
              for sanitizers in ('address,undefined', 'thread'):
                  print('Sanitizers:', sanitizers, flush=True)
                  os.environ['CFLAGS'] = f'-g -fno-omit-frame-pointer -fsanitize={sanitizers} -fno-sanitize-recover=all'
                  suite = unittest.defaultTestLoader.loadTestsFromNames(names)
                  assert suite.countTestCases() == 52
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  if not result.wasSuccessful() or result.skipped or result.testsRun != 52:
                      sys.exit(1)
          finally:
              admitted['check']()
          PY
      - name: Check installed runtime and doctor
        run: |
          cd "$RUNNER_TEMP"
          "${CI_PYTHON:?}" -I -B "${CI_CONTAINER:?}/bootstrap.py" check "${CI_CONTAINER:?}"
          "${CI_STALLIONFS:?}" --root "$RUNNER_TEMP/stallionfs-smoke" doctor

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.images }})
    needs: test-execution
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', images: '0'}
          - {os: macos-26, python: '3.11', images: '1'}
          - {os: macos-26, python: '3.13', images: '1'}
          - {os: macos-26, python: '3.14', images: '1'}
          - {os: macos-26-intel, python: '3.13', images: '1'}
          - {os: xcode-27, python: '3.13', images: '1'}
    steps:
      - name: Require all installed and sanitizer jobs
        env:
          EXECUTION_RESULT: ${{ needs.test-execution.result }}
        run: test "${EXECUTION_RESULT:-}" = success

  hosted-docs-screen:
    name: Hosted document clone screen
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["compare","thread-cpu","directory-feasibility","directory-docs-feasibility","delete-thread-cpu"]'), inputs.mode)
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: hosted-docs-clone-screen
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: -j1
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      MAX_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and install public source wheel
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
          PHASE_MODE: ${{ inputs.mode }}
        run: |
          umask 077
          if [ "$PHASE_MODE" = 'thread-cpu' ]; then
            export CFLAGS="${CFLAGS:-} -DSTALLIONFS_DIAGNOSTIC_THREAD_CPU=1"
          elif [ "$PHASE_MODE" = 'delete-thread-cpu' ]; then
            export CFLAGS="${CFLAGS:-} -DSTALLIONFS_DIAGNOSTIC_THREAD_CPU=1 -DSTALLIONFS_DIAGNOSTIC_DELETE_CPU=1"
          elif [ "$PHASE_MODE" = 'directory-feasibility' ] || [ "$PHASE_MODE" = 'directory-docs-feasibility' ]; then
            export CFLAGS=''
          elif [ "$PHASE_MODE" != 'compare' ]; then
            exit 2
          fi
          mkdir "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT/evidence/receipts" "$SCREEN_ROOT/wheels" "$SCREEN_ROOT/scratch"
          python -m venv "$SCREEN_ROOT/venv"
          "$SCREEN_ROOT/venv/bin/python" -m pip wheel --no-deps --wheel-dir "$SCREEN_ROOT/wheels" "$GITHUB_WORKSPACE"
          "$SCREEN_ROOT/venv/bin/python" -m pip install --force-reinstall --no-deps "$SCREEN_ROOT/wheels/"*.whl
      - name: Record source and hosted environment
        if: inputs.mode == 'compare'
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          import stallionfs
          root = Path(os.environ['SCREEN_ROOT'])
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          sys.path.insert(0, str(checkout / 'tests/perf'))
          import fileops
          binary = root / 'venv/bin/stallionfs'
          revision = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True, timeout=10).strip()
          if revision != os.environ['GITHUB_SHA'] or Path(stallionfs.__file__).resolve().is_relative_to(checkout):
              raise RuntimeError('Source or installed-wheel identity mismatch')
          volume = fileops.scratch_volume(json.loads(subprocess.check_output([str(binary), '--json', 'volumes'], timeout=15)), root / 'scratch')
          wheels = list((root / 'wheels').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected exactly one source wheel')
          def sysctl(key):
              return subprocess.check_output(['/usr/sbin/sysctl', '-n', key], text=True, timeout=5).strip()
          metadata = {'scope': 'hosted-source-build-only; not installed-release proof',
              'revision': revision, 'runner_label': 'xcode-27', 'os': platform.platform(), 'arch': platform.machine(),
              'cpu': sysctl('machdep.cpu.brand_string'), 'hardware_model': sysctl('hw.model'),
              'logical_cpus': int(sysctl('hw.logicalcpu')), 'ram_bytes': int(sysctl('hw.memsize')),
              'volume': {key: volume[key] for key in ('filesystem', 'device', 'path', 'readonly')},
              'cache': 'warm generated fixture; no purge; residency not guaranteed',
              'wheel_sha256': hashlib.sha256(wheels[0].read_bytes()).hexdigest(),
              'cli_sha256': hashlib.sha256(binary.read_bytes()).hexdigest()}
          (root / 'evidence/environment.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Collect fixed document clone comparison
        if: inputs.mode == 'compare'
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os, sys, time
          from pathlib import Path
          import stallionfs
          from stallionfs._benchmark_budget import command
          root = Path(os.environ['SCREEN_ROOT']); evidence = root / 'evidence'
          binary = root / 'venv/bin/stallionfs'
          env = dict(os.environ)
          env.update(STALLIONFS_BENCHMARK_DEADLINE=str(time.monotonic() + 600),
              STALLIONFS_BENCHMARK_RECEIPTS=str(evidence / 'receipts'),
              STALLIONFS_BENCHMARK_BINARY=str(binary.resolve()),
              STALLIONFS_BENCHMARK_PACKAGE=str(Path(stallionfs.__file__).resolve().parent))
          argv = [sys.executable, '-B', str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf/native_suite.py'),
              '--binary', str(binary), '--scratch', str(root / 'scratch'), '--output', str(evidence / 'native.json'),
              '--fixtures', 'docs_5k_100mb', '--operations', 'clone', '--copy-tools', 'ditto',
              '--jobs', '2', '--samples', '10', '--runs', '1', '--cache', 'warm', '--timeout', '120']
          outcome = {'returncode': 1}; receipt = {}
          try:
              outcome['returncode'] = command(argv, cwd=root, environment=env, timeout=630,
                  receipt=receipt, output_limit=1048576).returncode
          except Exception as error:
              outcome['error'] = type(error).__name__ + ': ' + str(error)
          finally:
              outcome['receipt'] = receipt
              (evidence / 'collector-outcome.json').write_text(json.dumps(outcome, indent=2) + '\n')
          raise SystemExit(outcome['returncode'])
          PY
      - name: Collect thread CPU phases
        if: inputs.mode == 'thread-cpu'
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os, sys, time
          from pathlib import Path
          from stallionfs._benchmark_budget import command
          root = Path(os.environ['SCREEN_ROOT'])
          control = root / 'scratch/phase-control'
          control.mkdir(mode=0o700)
          receipts = control / 'receipts'
          receipts.mkdir(mode=0o700)
          output = root / 'evidence/thread-cpu-status.json'
          os.environ['STALLIONFS_BENCHMARK_RECEIPTS'] = str(receipts)
          os.environ['STALLIONFS_BENCHMARK_DEADLINE'] = str(time.monotonic() + 160)
          code = 1
          try:
              wheels = list((root / 'wheels').glob('*.whl'))
              if len(wheels) != 1:
                  raise RuntimeError('Wheel identity unavailable')
              argv = [sys.executable, '-I', '-B', str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf/native_phase_probe.py'),
                  '--binary', str(root / 'venv/bin/stallionfs'), '--wheel', str(wheels[0]), '--scratch', str(root / 'scratch'),
                  '--output', str(output), '--revision', os.environ['GITHUB_SHA']]
              code = command(argv, cwd=control, timeout=150, umask=0o077, output_limit=65536).returncode
          except BaseException:
              pass
          if not output.exists():
              with output.open('x') as artifact:
                  json.dump({'schema': 1, 'scope': 'hosted diagnostic source build', 'status': 'incomplete',
                      'target_completion': 'unknown', 'correctness': None, 'counter_status': 'unavailable',
                      'clone_attempts': None, 'cleanup': 'retained_ephemeral', 'benchmark_verdict': 'not_applicable',
                      'error': 'outer_capture_incomplete'}, artifact)
          raise SystemExit(code)
          PY
      - name: Collect fixed-cache delete CPU phases
        if: inputs.mode == 'delete-thread-cpu'
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
          STALLIONFS_DELETE_CPU_HOSTED: '1'
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os, signal, sys, time
          from pathlib import Path
          from stallionfs._benchmark_budget import command
          deadline = time.monotonic() + 900
          os.environ['STALLIONFS_BENCHMARK_DEADLINE'] = str(deadline)
          def expired(*_):
              raise TimeoutError('Aggregate diagnostic deadline exhausted')
          signal.signal(signal.SIGALRM, expired)
          signal.setitimer(signal.ITIMER_REAL, max(0.001, deadline - time.monotonic()))
          root = Path(os.environ['SCREEN_ROOT'])
          control = root / 'scratch/delete-control'; control.mkdir(mode=0o700)
          receipts = control / 'receipts'; receipts.mkdir(mode=0o700)
          candidate = control / 'driver-status.json'
          output = root / 'evidence/delete-thread-cpu-status.json'
          os.environ['STALLIONFS_BENCHMARK_RECEIPTS'] = str(receipts)
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf'))
          from native_phase_probe import clean_capture, publish, read_report
          code, receipt = 1, {}
          value = {'schema': 1, 'scope': 'hosted fixed-cache delete CPU only', 'status': 'incomplete',
              'stage': 'outer_capture', 'target_completion': 'unknown', 'delete_attempts': None,
              'counter_status': 'unavailable', 'cleanup': 'retained_ephemeral', 'correctness': None,
              'benchmark_verdict': 'not_applicable', 'error': 'outer_capture_incomplete'}
          try:
              wheels = list((root / 'wheels').glob('*.whl'))
              if len(wheels) != 1:
                  raise RuntimeError('Wheel identity unavailable')
              argv = [sys.executable, '-I', '-B', str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf/native_delete_phase_probe.py'),
                  '--binary', str(root / 'venv/bin/stallionfs'), '--wheel', str(wheels[0]), '--scratch', str(root / 'scratch'),
                  '--output', str(candidate), '--revision', os.environ['GITHUB_SHA']]
              # The child stops work at deadline-30. Fifteen seconds then remain
              # for its status, followed by fifteen for outer reap/publication.
              allowed = deadline - 15 - time.monotonic()
              if allowed <= 0:
                  raise TimeoutError('No aggregate supervision budget')
              child = command(argv, cwd=control, timeout=allowed, umask=0o077, receipt=receipt, output_limit=65536)
              capture = dict(receipt)
              capture['exit_code'] = 0
              if (child.returncode not in (0, 1) or type(receipt.get('exit_code')) is not int
                  or receipt['exit_code'] != child.returncode or not clean_capture(capture) or time.monotonic() >= deadline):
                  raise RuntimeError('Outer completion unavailable')
              observed = read_report(candidate)
              if child.returncode == 0:
                  if observed.get('status') != 'complete' or observed.get('cleanup') != 'complete':
                      raise RuntimeError('Driver success status unavailable')
              elif observed.get('status') != 'incomplete':
                  raise RuntimeError('Failed driver cannot publish success')
              value, code = observed, child.returncode
          except BaseException:
              pass
          if time.monotonic() >= deadline:
              raise TimeoutError('No status publication budget')
          publish(output, value)
          signal.setitimer(signal.ITIMER_REAL, 0)
          raise SystemExit(code)
          PY
      - name: Collect hosted directory feasibility
        if: inputs.mode == 'directory-feasibility' || inputs.mode == 'directory-docs-feasibility'
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
          STALLIONFS_DIRECTORY_FEASIBILITY_HOSTED: '1'
          DIRECTORY_DOCS_ONLY: ${{ inputs.mode == 'directory-docs-feasibility' }}
        run: |
          umask 077
          /usr/bin/xcrun clang -O2 -Wall -Wextra -Werror -pthread "$GITHUB_WORKSPACE/tests/native_directory_clone_probe.c" -o "$SCREEN_ROOT/directory-clone-probe"
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os, sys, time
          from pathlib import Path
          from stallionfs._benchmark_budget import command
          root = Path(os.environ['SCREEN_ROOT'])
          control = root / 'scratch/directory-control'
          control.mkdir(mode=0o700)
          receipts = control / 'receipts'; receipts.mkdir(mode=0o700)
          output = root / 'evidence/directory-feasibility-status.json'
          os.environ['STALLIONFS_BENCHMARK_RECEIPTS'] = str(receipts)
          docs_only = os.environ['DIRECTORY_DOCS_ONLY'] == 'true'
          os.environ['STALLIONFS_BENCHMARK_DEADLINE'] = str(time.monotonic() + (900 if docs_only else 210))
          code = 1
          try:
              wheels = list((root / 'wheels').glob('*.whl'))
              if len(wheels) != 1:
                  raise RuntimeError('Wheel identity unavailable')
              argv = [sys.executable, '-I', '-B', str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf/native_directory_clone_probe.py'),
                  '--binary', str(root / 'venv/bin/stallionfs'), '--wheel', str(wheels[0]),
                  '--helper', str(root / 'directory-clone-probe'), '--scratch', str(root / 'scratch'),
                  '--output', str(output), '--revision', os.environ['GITHUB_SHA'],
                  '--restore-docs-only' if docs_only else '--restore-small-recipes-only']
              code = command(argv, cwd=control, timeout=890 if docs_only else 200, umask=0o077, output_limit=65536).returncode
          except BaseException:
              pass
          if not output.exists():
              fallback = {'schema': 1, 'scope': 'hosted nineteen-recipe selective restoration only', 'status': 'incomplete',
                      'first_recipe_only': False, 'small_recipes_only': True, 'restoration_only': True,
                      'small_gate_qualified': False, 'full_gate_qualified': False,
                      'target_completion': 'unknown', 'cases': [], 'docs_attempted': None, 'helper_invocations': None, 'clone_calls': None,
                      'cleanup': 'retained_ephemeral', 'benchmark_verdict': 'not_applicable',
                      'concurrency_and_cancellation': 'unresolved', 'error': 'outer_capture_incomplete'}
              if docs_only:
                  fallback.update(scope='hosted fixed-docs selective restoration only', small_recipes_only=False,
                      docs_only=True, docs_gate_qualified=False)
              with output.open('x') as artifact:
                  json.dump(fallback, artifact)
          raise SystemExit(code)
          PY
      - name: Show correctness and existing case gate
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        if: always() && inputs.mode == 'compare'
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['SCREEN_ROOT']); evidence = root / 'evidence'
          result = {'scope': 'hosted-source-build-only; not installed-release proof', 'status': 'incomplete', 'accepted': False}
          try:
              sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf'))
              from native_report import ReportJournal
              outcome = json.loads((evidence / 'collector-outcome.json').read_text())
              journal = ReportJournal.open_existing(evidence / 'native.json')
              try:
                  report = journal.state
              finally:
                  journal.close()
              screens = report.get('case_performance_screens')
              result.update(collection_status=report.get('status'), correctness=report.get('passed'),
                  cleanup_passed=report.get('cleanup_passed'), case_performance_screens=screens)
              expected = {'run': 0, 'fixture': 'docs_5k_100mb', 'operation': 'clone', 'reference': 'ditto', 'cache': 'warm'}
              valid = (outcome.get('returncode') == 0 and outcome.get('receipt', {}).get('completion_uncertain') is False
                  and report.get('status') == 'complete' and report.get('passed') is True and report.get('cleanup_passed') is True
                  and isinstance(screens, list) and len(screens) == 1)
              screen = screens[0] if valid else {}
              valid = (valid and {key: screen.get(key) for key in expected} == expected
                  and screen.get('status') == 'pass' and screen.get('correctness_qualified') is True
                  and screen.get('any_two_metrics_won') is True)
              if not valid:
                  raise RuntimeError('Collector correctness, cleanup or exact case gate did not pass')
              result.update(status='pass', accepted=True)
          except Exception as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'case-status.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Hosted source-build-only screen; not installed-release proof.\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          raise SystemExit(0 if result['accepted'] else 1)
          PY
      - name: Preserve synthetic screen evidence
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        if: always() && inputs.mode == 'compare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-docs-clone-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SCREEN_ROOT }}/evidence/environment.json
            ${{ env.SCREEN_ROOT }}/evidence/collector-outcome.json
            ${{ env.SCREEN_ROOT }}/evidence/case-status.json
            ${{ env.SCREEN_ROOT }}/evidence/native.json
            ${{ env.SCREEN_ROOT }}/evidence/native.json.journal
            ${{ env.SCREEN_ROOT }}/evidence/native.json.manifest
            ${{ env.SCREEN_ROOT }}/evidence/receipts/*.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve thread CPU phase status
        if: always() && inputs.mode == 'thread-cpu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-thread-cpu-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-docs-clone-screen/evidence/thread-cpu-status.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve fixed-cache delete CPU status
        if: always() && inputs.mode == 'delete-thread-cpu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-delete-thread-cpu-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-docs-clone-screen/evidence/delete-thread-cpu-status.json
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve directory feasibility status
        if: always() && (inputs.mode == 'directory-feasibility' || inputs.mode == 'directory-docs-feasibility')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-directory-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-docs-clone-screen/evidence/directory-feasibility-status.json
          if-no-files-found: error
          retention-days: 3

  unsigned-app-artifact:
    name: Unsigned FSKit build components
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'unsigned-app-artifact'
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: -j1
      MAX_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check artifact boundaries and existing package validation
        run: |
          python -B -m unittest discover -s tests -p 'test_*package*.py' -v
          PYTHONPATH=tests python -B -m unittest test_native_directory_clone_probe.DirectoryProbe.test_workflow_routes_each_mode_and_artifact_explicitly -v
      - name: Build and verify unsigned components
        run: python -B tools/build_fskit_artifact.py --out "$RUNNER_TEMP/unsigned-app-components"
      - name: Retain verified unsigned component archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-fskit-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned-app-components/StallionFS-unsigned-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  native-git-qualification:
    name: One-shot Intel native Git qualification
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'native-git-qualification'
    runs-on: macos-26-intel
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: native-git-qualification-${{ inputs.expected-source-sha }}
      cancel-in-progress: false
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      QUALIFICATION_MODE: ${{ inputs.mode }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require exact manual source and first attempt
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import os, re
          expected = os.environ.get('EXPECTED_SOURCE_SHA', '')
          assert re.fullmatch('[0-9a-f]{40}', expected) and expected == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['QUALIFICATION_MODE'] == 'native-git-qualification'
          assert os.environ['RUNNER_OS'] == 'macOS' and os.environ['RUNNER_ARCH'] == 'X64'
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Place verified standalone Intel interpreter in owned directory
        run: /usr/bin/python3 -I -B tools/ci_native_python.py --output "$RUNNER_TEMP/qualification-python"
      - name: Install exact bounded build dependency
        run: '"$CI_QUALIFICATION_PYTHON" -I -B -m pip --isolated install --no-deps --no-compile --only-binary=:all: --require-hashes -r tools/ci-build-requirements.txt'
      - name: Run one bounded raw build and native campaign
        id: native-qualification
        run: '"$CI_QUALIFICATION_PYTHON" -I -B tools/ci_native_qualify.py execute --checkout "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/native-git-qualification"'
      - name: Validate finite qualification transfer
        id: qualification-transfer
        if: always()
        env:
          QUALIFICATION_STEP_OUTCOME: ${{ steps.native-qualification.outcome }}
        run: |
          if test -f "$RUNNER_TEMP/native-git-qualification/transfer-result.json" || test -f "$RUNNER_TEMP/native-git-qualification/failure-transfer-result.json"; then
            /usr/bin/python3 -I -B tools/ci_native_qualify.py transfer-ready --checkout "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/native-git-qualification"
          fi
      - name: Transfer finite qualification result
        if: always() && steps.qualification-transfer.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-git-qualification-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.qualification-transfer.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  registered-git-recheck:
    name: Registered Git recheck (${{ matrix.architecture }})
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'registered-git-recheck'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, architecture: arm64, runner_architecture: ARM64}
          - {os: macos-26-intel, architecture: x86_64, runner_architecture: X64}
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: registered-git-recheck-${{ inputs.expected-source-sha }}-${{ matrix.architecture }}
      cancel-in-progress: false
    env:
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      QUALIFICATION_MODE: ${{ inputs.mode }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require exact manual source and first attempt
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import os, re
          expected = os.environ.get('EXPECTED_SOURCE_SHA', '')
          assert re.fullmatch('[0-9a-f]{40}', expected) and expected == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['QUALIFICATION_MODE'] == 'registered-git-recheck'
          architecture = os.environ['EXPECTED_ARCHITECTURE']
          assert architecture in ('arm64', 'x86_64')
          assert os.environ['RUNNER_OS'] == 'macOS' and os.environ['RUNNER_ARCH'] == {'arm64': 'ARM64', 'x86_64': 'X64'}[architecture]
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Place verified standalone host interpreter in owned directory
        run: /usr/bin/python3 -I -B tools/ci_native_python.py --architecture "${EXPECTED_ARCHITECTURE:?}" --output "$RUNNER_TEMP/qualification-python"
      - name: Install exact bounded build dependency
        run: '"$CI_QUALIFICATION_PYTHON" -I -B -m pip --isolated install --no-deps --no-compile --only-binary=:all: --require-hashes -r tools/ci-build-requirements.txt'
      - name: Run current wheel and registered native campaign
        id: native-qualification
        run: '"$CI_QUALIFICATION_PYTHON" -I -B tools/ci_native_qualify.py execute-registered --checkout "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/registered-git-recheck"'
      - name: Validate finite qualification transfer
        id: qualification-transfer
        if: always()
        env:
          QUALIFICATION_STEP_OUTCOME: ${{ steps.native-qualification.outcome }}
        run: |
          if test -f "$RUNNER_TEMP/registered-git-recheck/transfer-result.json" || test -f "$RUNNER_TEMP/registered-git-recheck/failure-transfer-result.json"; then
            /usr/bin/python3 -I -B tools/ci_native_qualify.py registered-transfer-ready --checkout "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/registered-git-recheck"
          fi
      - name: Transfer finite qualification result
        if: always() && steps.qualification-transfer.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registered-git-recheck-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.qualification-transfer.outputs.archive }}
          if-no-files-found: error
          retention-days: 1
