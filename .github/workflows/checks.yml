name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', images: '0'}
          - {os: macos-26, python: '3.11', images: '1'}
          - {os: macos-26, python: '3.13', images: '1'}
          - {os: macos-26, python: '3.14', images: '1'}
          - {os: macos-26-intel, python: '3.13', images: '1'}
    env:
      STALLIONFS_TEST_IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m compileall -q stallionfs
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel with image failure diagnostics
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import faulthandler
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          import sys
          import unittest
          import stallionfs
          from stallionfs import images, _scan

          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(stallionfs.__file__).resolve().is_relative_to(checkout)
          assert not Path(_scan.__file__).resolve().is_relative_to(checkout)
          original = images._command

          def inspect_image(args):
              creating = args[1] == 'create'
              image = os.path.realpath(args[-1]) if creating else None
              device = None if creating else str(args[2])
              response = subprocess.run(['/usr/bin/hdiutil', 'info', '-plist'],
                                        stdin=subprocess.DEVNULL, capture_output=True, timeout=10)
              response.check_returncode()
              records = plistlib.loads(response.stdout).get('images', [])
              matches = [r for r in records if r.get('owner-uid') == os.getuid() and
                         (os.path.realpath(r.get('image-path', '')) == image if creating else
                          any(e.get('dev-entry') == device for e in r.get('system-entities', [])))]
              devices = {e['dev-entry'] for r in matches for e in r.get('system-entities', [])
                         if e.get('dev-entry')}
              points = {e['mount-point'] for r in matches for e in r.get('system-entities', [])
                        if e.get('mount-point')}
              paths = {r['image-path'] for r in matches if r.get('image-path')}
              raw_devices = {'/dev/r' + d[5:] for d in devices
                             if re.fullmatch(r'/dev/disk[0-9]+(?:s[0-9]+)*', d)
                             and os.path.exists('/dev/r' + d[5:])}
              if image and os.path.exists(image):
                  paths.add(image)
              print('Image attachments:', json.dumps([{
                  'image': r.get('image-path'), 'entities': r.get('system-entities', [])
              } for r in matches]), file=sys.stderr, flush=True)
              print('Matching mounts:', json.dumps([r for r in _scan.mounts()
                    if r['device'] in devices or r['path'] in points]), file=sys.stderr, flush=True)
              for options, names in (([], paths | devices | raw_devices), (['+f'], points)):
                  if not names:
                      continue
                  result = subprocess.run(['/usr/sbin/lsof', '-nP', '-F', 'pcftn', *options, '--', *sorted(names)],
                                          stdin=subprocess.DEVNULL, capture_output=True, timeout=10)
                  print('Scoped lsof:', result.returncode, file=sys.stderr)
                  print(result.stdout.decode(errors='replace'), file=sys.stderr)
                  print(result.stderr.decode(errors='replace'), file=sys.stderr, flush=True)

          def diagnostic_command(*args):
              if len(args) < 2 or args[0] != '/usr/bin/hdiutil' or args[1] not in ('create', 'detach'):
                  return original(*args)
              try:
                  return original(*args, '-verbose')
              except BaseException as error:
                  try:
                      print('Image command failure (including intentional busy-volume checks):',
                            repr(tuple(map(str, args))), str(error), file=sys.stderr, flush=True)
                      inspect_image(args)
                  except BaseException as inspection:
                      try:
                          print('Image diagnostics unavailable:', type(inspection).__name__,
                                file=sys.stderr, flush=True)
                      except BaseException:
                          pass
                  raise

          images._command = diagnostic_command
          faulthandler.dump_traceback_later(300)
          suite = unittest.defaultTestLoader.discover(str(checkout / 'tests'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          faulthandler.cancel_dump_traceback_later()
          required_skips = os.environ.get('STALLIONFS_TEST_IMAGES') == '1' and result.skipped
          if required_skips:
              print('Required filesystem tests were skipped.', file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(required_skips))
          PY
      - name: Check native code with sanitizers
        if: matrix.python == '3.13'
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          names = (
              'test_fileops.FileOperations.test_native_swaps_enospc_no_fallback_cancellation_and_fd_cleanup',
              'test_scan.Scan.test_native_cancellation_close_errors_and_no_partial_cli_totals',
          )
          for sanitizers in ('address,undefined', 'thread'):
              print('Sanitizers:', sanitizers, flush=True)
              os.environ['CFLAGS'] = f'-g -fno-omit-frame-pointer -fsanitize={sanitizers} -fno-sanitize-recover=all'
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped:
                  sys.exit(1)
          PY
      - run: |
          cd "$RUNNER_TEMP"
          stallionfs --root "$RUNNER_TEMP/stallionfs-smoke" doctor
