name: Checks
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: ${{ matrix.os == 'macos-26-intel' && 30 || 15 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, python: '3.12', images: '0'}
          - {os: macos-26, python: '3.11', images: '1'}
          - {os: macos-26, python: '3.13', images: '1'}
          - {os: macos-26, python: '3.14', images: '1'}
          - {os: macos-26-intel, python: '3.13', images: '1'}
          - {os: xcode-27, python: '3.13', images: '1'}
    env:
      STALLIONFS_TEST_IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m compileall -q stallionfs
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel with image failure diagnostics
        env:
          STALLIONFS_FSKIT_ARTIFACT_DIR: ${{ runner.temp }}/fskit-interface-diagnostics
          STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT: ${{ matrix.os == 'xcode-27' && '1' || '0' }}
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import faulthandler
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import unittest
          import stallionfs
          from stallionfs import images, _scan

          require_contextual = os.environ.get('STALLIONFS_REQUIRE_CONTEXTUAL_FSKIT') == '1'
          contextual_test = 'test_fskit.FSKitInterfaces.test_contextual_and_legacy_callbacks_and_production_builds'

          def require_contextual_environment():
              host = (sys.platform, platform.mac_ver()[0], platform.machine())
              print('Contextual FSKit host:', host, flush=True)
              def version(label, argv):
                  child = subprocess.run(argv, capture_output=True, text=True, timeout=15)
                  print(f'{label}: {child.stdout.strip()!r}; stderr: {child.stderr.strip()!r}', flush=True)
                  child.check_returncode()
                  return child.stdout.strip()
              build = version('macOS build', ['/usr/bin/sw_vers', '-buildVersion'])
              xcode = version('Selected Xcode', ['/usr/bin/xcodebuild', '-version'])
              sdk = version('Selected macOS SDK', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version'])
              if (host[0] != 'darwin' or not re.fullmatch(r'\d+(?:\.\d+)*', host[1])
                      or int(host[1].split('.')[0]) < 27 or host[2] != 'arm64'
                      or not re.fullmatch(r'\d+[A-Z]\d+[a-z]?', build)
                      or not re.fullmatch(r'Xcode 27\.1\nBuild version [A-Za-z0-9]+', xcode)
                      or sdk != '27.0'):
                  raise RuntimeError('Contextual FSKit requires macOS 27+ ARM64 with selected Xcode 27.1 and SDK 27.0')

          class ContextualResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.contextual_successes = 0
              def addSuccess(self, test):
                  super().addSuccess(test)
                  if test.id() == contextual_test:
                      self.contextual_successes += 1

          if require_contextual:
              require_contextual_environment()

          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not Path(stallionfs.__file__).resolve().is_relative_to(checkout)
          assert not Path(_scan.__file__).resolve().is_relative_to(checkout)
          sys.path.insert(0, str(checkout / 'tests'))
          from image_failure_diagnostics import install
          diagnostics = install(images, Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          faulthandler.dump_traceback_later(300, repeat=True)
          suite = unittest.defaultTestLoader.discover(str(checkout / 'tests'))
          try:
              result = unittest.TextTestRunner(verbosity=2, resultclass=ContextualResult).run(suite)
          finally:
              try:
                  diagnostics.close()
              except Exception as error:
                  print('Diagnostic close failed:', type(error).__name__, file=sys.stderr)
          faulthandler.cancel_dump_traceback_later()
          capability_skips = [
              (test, reason) for test, reason in result.skipped
              if test.id() == 'setUpClass (test_fskit.FSKitInterfaces)'
              and reason.startswith('FSKit capability unavailable: ')
          ]
          for _, reason in capability_skips:
              print(reason, file=sys.stderr)
          required_skips = os.environ.get('STALLIONFS_TEST_IMAGES') == '1' and [
              entry for entry in result.skipped if entry not in capability_skips
          ]
          if required_skips:
              print('Required filesystem tests were skipped.', file=sys.stderr)
          missing_contextual = require_contextual and result.contextual_successes != 1
          if missing_contextual:
              print(f'Required {contextual_test} successes: expected 1, observed {result.contextual_successes}', file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(required_skips) or missing_contextual)
          PY
      - name: Validate bounded image diagnostic artifact
        if: failure()
        id: image-diagnostics
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          from image_failure_diagnostics import artifact_available
          available = artifact_available(Path(os.environ['RUNNER_TEMP']).resolve() / 'image-failure-diagnostics')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(available).lower() + '\n')
          PY
      - name: Upload bounded image failure diagnostics
        if: failure() && steps.image-diagnostics.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-failure-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/image-failure-diagnostics/image-failures.jsonl
          if-no-files-found: error
          retention-days: 1
      - name: Upload FSKit interface failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fskit-interface-failure-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/fskit-interface-diagnostics/*.command.json
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stdout.bin
            ${{ runner.temp }}/fskit-interface-diagnostics/*.stderr.bin
          if-no-files-found: ignore
          retention-days: 1
      - name: Check native code with sanitizers
        if: matrix.python == '3.13'
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests'))
          names = (
              'test_fileops.FileOperations.test_native_swaps_enospc_no_fallback_cancellation_and_fd_cleanup',
              'test_scan.Scan.test_native_cancellation_close_errors_and_no_partial_cli_totals',
              'test_image.ImageCore',
          )
          for sanitizers in ('address,undefined', 'thread'):
              print('Sanitizers:', sanitizers, flush=True)
              os.environ['CFLAGS'] = f'-g -fno-omit-frame-pointer -fsanitize={sanitizers} -fno-sanitize-recover=all'
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped:
                  sys.exit(1)
          PY
      - run: |
          cd "$RUNNER_TEMP"
          stallionfs --root "$RUNNER_TEMP/stallionfs-smoke" doctor

  hosted-docs-screen:
    name: Hosted document clone screen
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: hosted-docs-clone-screen
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: -j1
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      MAX_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and install public source wheel
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          umask 077
          mkdir "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT/evidence/receipts" "$SCREEN_ROOT/wheels" "$SCREEN_ROOT/scratch"
          python -m venv "$SCREEN_ROOT/venv"
          "$SCREEN_ROOT/venv/bin/python" -m pip wheel --no-deps --wheel-dir "$SCREEN_ROOT/wheels" "$GITHUB_WORKSPACE"
          "$SCREEN_ROOT/venv/bin/python" -m pip install --force-reinstall --no-deps "$SCREEN_ROOT/wheels/"*.whl
      - name: Record source and hosted environment
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          import stallionfs
          root = Path(os.environ['SCREEN_ROOT'])
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          sys.path.insert(0, str(checkout / 'tests/perf'))
          import fileops
          binary = root / 'venv/bin/stallionfs'
          revision = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True, timeout=10).strip()
          if revision != os.environ['GITHUB_SHA'] or Path(stallionfs.__file__).resolve().is_relative_to(checkout):
              raise RuntimeError('Source or installed-wheel identity mismatch')
          volume = fileops.scratch_volume(json.loads(subprocess.check_output([str(binary), '--json', 'volumes'], timeout=15)), root / 'scratch')
          wheels = list((root / 'wheels').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected exactly one source wheel')
          def sysctl(key):
              return subprocess.check_output(['/usr/sbin/sysctl', '-n', key], text=True, timeout=5).strip()
          metadata = {'scope': 'hosted-source-build-only; not installed-release proof',
              'revision': revision, 'runner_label': 'xcode-27', 'os': platform.platform(), 'arch': platform.machine(),
              'cpu': sysctl('machdep.cpu.brand_string'), 'hardware_model': sysctl('hw.model'),
              'logical_cpus': int(sysctl('hw.logicalcpu')), 'ram_bytes': int(sysctl('hw.memsize')),
              'volume': {key: volume[key] for key in ('filesystem', 'device', 'path', 'readonly')},
              'cache': 'warm generated fixture; no purge; residency not guaranteed',
              'wheel_sha256': hashlib.sha256(wheels[0].read_bytes()).hexdigest(),
              'cli_sha256': hashlib.sha256(binary.read_bytes()).hexdigest()}
          (root / 'evidence/environment.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Collect fixed document clone comparison
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        run: |
          cd "$RUNNER_TEMP"
          "$SCREEN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os, sys, time
          from pathlib import Path
          import stallionfs
          from stallionfs._benchmark_budget import command
          root = Path(os.environ['SCREEN_ROOT']); evidence = root / 'evidence'
          binary = root / 'venv/bin/stallionfs'
          env = dict(os.environ)
          env.update(STALLIONFS_BENCHMARK_DEADLINE=str(time.monotonic() + 600),
              STALLIONFS_BENCHMARK_RECEIPTS=str(evidence / 'receipts'),
              STALLIONFS_BENCHMARK_BINARY=str(binary.resolve()),
              STALLIONFS_BENCHMARK_PACKAGE=str(Path(stallionfs.__file__).resolve().parent))
          argv = [sys.executable, '-B', str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf/native_suite.py'),
              '--binary', str(binary), '--scratch', str(root / 'scratch'), '--output', str(evidence / 'native.json'),
              '--fixtures', 'docs_5k_100mb', '--operations', 'clone', '--copy-tools', 'ditto',
              '--jobs', '2', '--samples', '10', '--runs', '1', '--cache', 'warm', '--timeout', '120']
          outcome = {'returncode': 1}; receipt = {}
          try:
              outcome['returncode'] = command(argv, cwd=root, environment=env, timeout=630,
                  receipt=receipt, output_limit=1048576).returncode
          except Exception as error:
              outcome['error'] = type(error).__name__ + ': ' + str(error)
          finally:
              outcome['receipt'] = receipt
              (evidence / 'collector-outcome.json').write_text(json.dumps(outcome, indent=2) + '\n')
          raise SystemExit(outcome['returncode'])
          PY
      - name: Show correctness and existing case gate
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          python -I -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['SCREEN_ROOT']); evidence = root / 'evidence'
          result = {'scope': 'hosted-source-build-only; not installed-release proof', 'status': 'incomplete', 'accepted': False}
          try:
              sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tests/perf'))
              from native_report import ReportJournal
              outcome = json.loads((evidence / 'collector-outcome.json').read_text())
              journal = ReportJournal.open_existing(evidence / 'native.json')
              try:
                  report = journal.state
              finally:
                  journal.close()
              screens = report.get('case_performance_screens')
              result.update(collection_status=report.get('status'), correctness=report.get('passed'),
                  cleanup_passed=report.get('cleanup_passed'), case_performance_screens=screens)
              expected = {'run': 0, 'fixture': 'docs_5k_100mb', 'operation': 'clone', 'reference': 'ditto', 'cache': 'warm'}
              valid = (outcome.get('returncode') == 0 and outcome.get('receipt', {}).get('completion_uncertain') is False
                  and report.get('status') == 'complete' and report.get('passed') is True and report.get('cleanup_passed') is True
                  and isinstance(screens, list) and len(screens) == 1)
              screen = screens[0] if valid else {}
              valid = (valid and {key: screen.get(key) for key in expected} == expected
                  and screen.get('status') == 'pass' and screen.get('correctness_qualified') is True
                  and screen.get('any_two_metrics_won') is True)
              if not valid:
                  raise RuntimeError('Collector correctness, cleanup or exact case gate did not pass')
              result.update(status='pass', accepted=True)
          except Exception as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'case-status.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Hosted source-build-only screen; not installed-release proof.\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          raise SystemExit(0 if result['accepted'] else 1)
          PY
      - name: Preserve synthetic screen evidence
        env:
          SCREEN_ROOT: ${{ runner.temp }}/hosted-docs-clone-screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-docs-clone-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SCREEN_ROOT }}/evidence/environment.json
            ${{ env.SCREEN_ROOT }}/evidence/collector-outcome.json
            ${{ env.SCREEN_ROOT }}/evidence/case-status.json
            ${{ env.SCREEN_ROOT }}/evidence/native.json
            ${{ env.SCREEN_ROOT }}/evidence/native.json.journal
            ${{ env.SCREEN_ROOT }}/evidence/native.json.manifest
            ${{ env.SCREEN_ROOT }}/evidence/receipts/*.json
          if-no-files-found: error
          retention-days: 3
